# Opt-in example: replace the Agent/Environment names with approved same-namespace
# resources and choose a spend policy before deploying this overlay. This
# ConfigMap contains routing policy only; credentials remain in Kubernetes Secrets.
# Config changes take effect when the gateway restarts. Existing attempts retain
# their frozen selection, and new events use the loaded route configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-work-routes
  namespace: codex-session-operator-system
data:
  routes.json: |
    [
      {
        "id": "team-investigation",
        "namespace": "codex-session-operator-system",
        "source": "manual",
        "agent": "approved-investigator-v1",
        "environment": "approved-tools-v1",
        "vaults": [],
        "spend_control": {"mode": "limited", "limitCents": 500}
      }
    ]
