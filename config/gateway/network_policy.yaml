apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codex-session-operator-gateway-internal
  namespace: codex-session-operator-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: gateway
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 8082
  - from:
    - podSelector:
        matchLabels:
          control-plane: controller-manager
    ports:
    - protocol: TCP
      port: 8083
