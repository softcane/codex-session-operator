apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-session-operator-controller-manager
  namespace: codex-session-operator-system
spec:
  template:
    spec:
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: manager
        env:
        - name: GATEWAY_INTERNAL_URL
          value: http://codex-session-operator-gateway.codex-session-operator-system.svc:8083
