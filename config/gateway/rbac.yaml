apiVersion: v1
kind: ServiceAccount
metadata:
  name: codex-session-operator-gateway
  namespace: codex-session-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: codex-session-operator-gateway
rules:
- apiGroups:
  - agents.softcane.io
  resources:
  - sessions
  - agents
  - environments
  - vaults
  - profiles
  verbs:
  - get
  - list
- apiGroups:
  - agents.softcane.io
  resources:
  - sessions
  verbs:
  - create
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: codex-session-operator-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: codex-session-operator-gateway
subjects:
- kind: ServiceAccount
  name: codex-session-operator-gateway
  namespace: codex-session-operator-system
---
# Executor observations are restricted to this managed namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codex-session-operator-executor-observation
  namespace: codex-session-operator-system
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - persistentvolumeclaims
  verbs:
  - get
- apiGroups:
  - extensions.agents.x-k8s.io
  resources:
  - sandboxclaims
  - sandboxwarmpools
  - sandboxtemplates
  verbs:
  - get
- apiGroups:
  - agents.x-k8s.io
  resources:
  - sandboxes
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codex-session-operator-executor-observation
  namespace: codex-session-operator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codex-session-operator-executor-observation
subjects:
- kind: ServiceAccount
  name: codex-session-operator-gateway
  namespace: codex-session-operator-system
