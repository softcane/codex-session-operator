---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: environments.agents.softcane.io
spec:
  group: agents.softcane.io
  names:
    kind: Environment
    listKind: EnvironmentList
    plural: environments
    singular: environment
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Environment is the Schema for the environments API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Environment
            properties:
              deletionPolicy:
                description: DeletionPolicy selects deletion or administrative retention
                  of owned resources.
                enum:
                - Delete
                - Retain
                type: string
              mode:
                description: EnvironmentMode selects a runtime; provider wire literals
                  are translated by the adapter.
                enum:
                - SelfHosted
                - OpenAIHosted
                - None
                type: string
              openaiHosted:
                description: HostedEnvironment owns the full remote template configuration.
                properties:
                  capabilityDirectories:
                    items:
                      maxLength: 4096
                      pattern: ^/workspace/[^/]+(/[^/]+)*$
                      type: string
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: set
                    x-kubernetes-validations:
                    - message: capability paths must stay inside workspace
                      rule: self.all(d, d.split('/').all(p, p != '.' && p != '..'))
                  containerSize:
                    default: medium
                    enum:
                    - small
                    - medium
                    - large
                    type: string
                  desktop:
                    type: boolean
                  env:
                    items:
                      description: HostedVariable reads values from the platform's
                        codex-environment Secret.
                      properties:
                        name:
                          pattern: ^[A-Za-z_][A-Za-z0-9_]{0,127}$
                          type: string
                        secretKey:
                          pattern: ^[a-zA-Z0-9._-]{1,253}$
                          type: string
                      required:
                      - name
                      - secretKey
                      type: object
                      x-kubernetes-validations:
                      - message: Runtime-reserved environment names are restricted
                        rule: self.name != 'PATH' && self.name != 'OPENAI_API_KEY'
                          && !self.name.startsWith('CODEX_')
                    maxItems: 64
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  files:
                    items:
                      description: HostedFile never stores inline bytes in the API.
                      properties:
                        fileID:
                          maxLength: 256
                          minLength: 1
                          type: string
                        path:
                          maxLength: 4096
                          pattern: ^/workspace/[^/]+(/[^/]+)*$
                          type: string
                          x-kubernetes-validations:
                          - message: path must be clean
                            rule: self.split('/').all(p, p != '.' && p != '..')
                        secretKey:
                          pattern: ^[a-zA-Z0-9._-]{1,253}$
                          type: string
                        type:
                          description: HostedFileType selects a protected source and
                            is translated to the provider file type.
                          enum:
                          - FileID
                          - Inline
                          type: string
                      required:
                      - path
                      - type
                      type: object
                      x-kubernetes-validations:
                      - message: fileID branch must match type
                        rule: (self.type == 'FileID') == has(self.fileID)
                      - message: inline branch must match type
                        rule: (self.type == 'Inline') == has(self.secretKey)
                    maxItems: 64
                    type: array
                    x-kubernetes-list-map-keys:
                    - path
                    x-kubernetes-list-type: map
                  name:
                    description: Optional display prefix; the controller retains an
                      ownership suffix.
                    maxLength: 128
                    type: string
                  network:
                    description: HostedNetwork sets explicit policy independently
                      of beta/GA defaults.
                    properties:
                      access:
                        enum:
                        - enabled
                        - disabled
                        - restricted
                        type: string
                      allowedDomains:
                        default: []
                        items:
                          maxLength: 256
                          minLength: 1
                          pattern: ^[a-zA-Z0-9]([-a-zA-Z0-9]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([-a-zA-Z0-9]*[a-zA-Z0-9])?)*$
                          type: string
                        maxItems: 100
                        type: array
                        x-kubernetes-list-type: set
                        x-kubernetes-validations:
                        - message: domains must be exact host names
                          rule: self.all(h, !h.contains('..'))
                      blockedDomains:
                        default: []
                        items:
                          maxLength: 253
                          pattern: ^[a-zA-Z0-9]([-a-zA-Z0-9]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([-a-zA-Z0-9]*[a-zA-Z0-9])?)*$
                          type: string
                        maxItems: 100
                        type: array
                        x-kubernetes-list-type: set
                        x-kubernetes-validations:
                        - message: domains must be exact host names
                          rule: self.all(h, !h.contains('..'))
                    required:
                    - access
                    type: object
                    x-kubernetes-validations:
                    - message: Domains require restricted access
                      rule: self.access == 'restricted' || (size(self.allowedDomains)
                        == 0 && size(self.blockedDomains) == 0)
                    - message: Allow and block lists cannot be combined
                      rule: size(self.allowedDomains) == 0 || size(self.blockedDomains)
                        == 0
                    - message: Restricted access requires domains
                      rule: self.access != 'restricted' || size(self.allowedDomains)
                        + size(self.blockedDomains) > 0
                  packages:
                    description: HostedPackages contains non-secret package specifiers.
                    properties:
                      npm:
                        items:
                          maxLength: 256
                          minLength: 1
                          type: string
                        maxItems: 64
                        type: array
                        x-kubernetes-list-type: atomic
                      python:
                        items:
                          maxLength: 256
                          minLength: 1
                          type: string
                        maxItems: 64
                        type: array
                        x-kubernetes-list-type: atomic
                      system:
                        items:
                          maxLength: 256
                          minLength: 1
                          type: string
                        maxItems: 64
                        type: array
                        x-kubernetes-list-type: atomic
                    type: object
                  plugins:
                    items:
                      description: HostedInlineCapability carries safe metadata and
                        a protected archive reference.
                      properties:
                        description:
                          maxLength: 2048
                          minLength: 1
                          type: string
                        name:
                          pattern: ^[a-z][a-z0-9-]{0,63}$
                          type: string
                        source:
                          description: HostedArchive pins a protected ZIP to an immutable
                            Secret object version.
                          properties:
                            secretKey:
                              pattern: ^[a-zA-Z0-9._-]{1,253}$
                              type: string
                            secretResourceVersion:
                              maxLength: 128
                              minLength: 1
                              type: string
                            secretUID:
                              maxLength: 128
                              minLength: 1
                              type: string
                          required:
                          - secretKey
                          - secretResourceVersion
                          - secretUID
                          type: object
                      required:
                      - description
                      - name
                      - source
                      type: object
                    maxItems: 16
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  setupCommands:
                    items:
                      description: HostedSetupCommand reads its command from the protected
                        platform Secret.
                      properties:
                        secretKey:
                          pattern: ^[a-zA-Z0-9._-]{1,253}$
                          type: string
                        workingDirectory:
                          default: /workspace
                          maxLength: 4096
                          pattern: ^/workspace(/[^/]+)*$
                          type: string
                          x-kubernetes-validations:
                          - message: working directory must be clean
                            rule: self.split('/').all(p, p != '.' && p != '..')
                      required:
                      - secretKey
                      type: object
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: atomic
                  skills:
                    items:
                      description: HostedSkill selects an exact API version or a pinned
                        protected archive.
                      properties:
                        inline:
                          description: HostedInlineCapability carries safe metadata
                            and a protected archive reference.
                          properties:
                            description:
                              maxLength: 2048
                              minLength: 1
                              type: string
                            name:
                              pattern: ^[a-z][a-z0-9-]{0,63}$
                              type: string
                            source:
                              description: HostedArchive pins a protected ZIP to an
                                immutable Secret object version.
                              properties:
                                secretKey:
                                  pattern: ^[a-zA-Z0-9._-]{1,253}$
                                  type: string
                                secretResourceVersion:
                                  maxLength: 128
                                  minLength: 1
                                  type: string
                                secretUID:
                                  maxLength: 128
                                  minLength: 1
                                  type: string
                              required:
                              - secretKey
                              - secretResourceVersion
                              - secretUID
                              type: object
                          required:
                          - description
                          - name
                          - source
                          type: object
                        skillID:
                          maxLength: 256
                          minLength: 1
                          type: string
                        type:
                          description: HostedSkillType selects a pinned provider reference
                            or a protected archive.
                          enum:
                          - SkillReference
                          - Inline
                          type: string
                        version:
                          maxLength: 20
                          pattern: ^[1-9][0-9]*$
                          type: string
                      required:
                      - type
                      type: object
                      x-kubernetes-validations:
                      - message: skillReference requires ID and concrete version
                        rule: (self.type == 'SkillReference') == (has(self.skillID)
                          && has(self.version))
                      - message: inline branch must match type
                        rule: (self.type == 'Inline') == has(self.inline)
                      - message: inline skill cannot carry reference fields
                        rule: self.type == 'SkillReference' || (!has(self.skillID)
                          && !has(self.version))
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: atomic
                required:
                - network
                type: object
              selfHosted:
                description: |-
                  SelfHostedEnvironment selects an administrator-approved Agent Sandbox pool.
                  Compute, repository preparation and storage configuration belong to its template.
                properties:
                  capabilityDirectories:
                    description: CapabilityDirectories names prepared installation
                      paths in the template.
                    items:
                      maxLength: 4096
                      pattern: ^/[^/]+(/[^/]+)*$
                      type: string
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: set
                    x-kubernetes-validations:
                    - message: capability paths must be clean absolute directories
                      rule: self.all(d, d.split('/').all(p, p != '.' && p != '..'))
                  sandboxPoolRef:
                    description: SandboxPoolRef selects a same-namespace SandboxWarmPool.
                    properties:
                      name:
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - name
                    type: object
                  workspace:
                    description: Workspace configures the workspace location and cleanup
                      policy.
                    properties:
                      deletionPolicy:
                        description: DeletionPolicy deletes the Sandbox and files,
                          or retains a suspended workspace.
                        enum:
                        - Delete
                        - Retain
                        type: string
                      directory:
                        default: /workspace
                        description: Directory must be a clean absolute directory
                          other than root.
                        maxLength: 4096
                        pattern: ^/[^/]+(/[^/]+)*$
                        type: string
                        x-kubernetes-validations:
                        - message: directory must be a clean absolute path
                          rule: self.split('/').all(p, p != '.' && p != '..')
                    required:
                    - deletionPolicy
                    type: object
                    x-kubernetes-validations:
                    - message: workspace directory overlaps a reserved runtime directory
                      rule: '![''/home'', ''/tmp'', ''/usr'', ''/bin'', ''/sbin'',
                        ''/etc'', ''/dev'', ''/proc'', ''/sys'', ''/run'', ''/capabilities''].exists(p,
                        self.directory == p || self.directory.startsWith(p + ''/''))'
                required:
                - sandboxPoolRef
                - workspace
                type: object
            required:
            - deletionPolicy
            - mode
            type: object
            x-kubernetes-validations:
            - message: Environment mode is immutable
              rule: self.mode == oldSelf.mode
            - message: selfHosted branch must match mode
              rule: (self.mode == 'SelfHosted') == has(self.selfHosted)
            - message: openaiHosted branch must match mode
              rule: (self.mode == 'OpenAIHosted') == has(self.openaiHosted)
          status:
            description: status defines the observed state of Environment
            properties:
              auditCandidateIDs:
                description: Audit candidates are never adopted automatically.
                items:
                  maxLength: 256
                  minLength: 1
                  type: string
                maxItems: 1000
                type: array
                x-kubernetes-list-type: set
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              configurationDigest:
                type: string
              creationAttempted:
                type: boolean
              creationName:
                type: string
              openaiTemplateID:
                type: string
              ownerScope:
                type: string
              sandboxPool:
                description: |-
                  SandboxPoolSnapshot freezes public identities and configuration of approved infrastructure.
                  Template configuration remains in native Agent Sandbox resources.
                properties:
                  configurationDigest:
                    type: string
                  generation:
                    format: int64
                    type: integer
                  name:
                    type: string
                  templateGeneration:
                    format: int64
                    type: integer
                  templateName:
                    type: string
                  templateUID:
                    type: string
                  uid:
                    type: string
                required:
                - configurationDigest
                - generation
                - name
                - templateGeneration
                - templateName
                - templateUID
                - uid
                type: object
              sourceVersion:
                description: EnvironmentSourceVersion identifies protected material
                  without hashing values.
                properties:
                  resourceVersion:
                    type: string
                  uid:
                    type: string
                required:
                - resourceVersion
                - uid
                type: object
              templateConfigurationDigest:
                description: TemplateConfigurationDigest excludes container size and
                  local deletion policy.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: Environments require deletionPolicy
          rule: has(self.spec.deletionPolicy)
    served: true
    storage: true
    subresources:
      status: {}
