---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: environments.agents.softcane.io
spec:
  group: agents.softcane.io
  names:
    kind: Environment
    listKind: EnvironmentList
    plural: environments
    singular: environment
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Environment is the Schema for the environments API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Environment
            properties:
              deletionPolicy:
                enum:
                - Delete
                - Retain
                type: string
              mode:
                enum:
                - selfHosted
                - openaiHosted
                - none
                type: string
              openaiHosted:
                description: HostedEnvironment owns the full remote template configuration.
                properties:
                  capabilityDirectories:
                    items:
                      maxLength: 4096
                      pattern: ^/workspace/
                      type: string
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: set
                  containerSize:
                    default: medium
                    enum:
                    - small
                    - medium
                    - large
                    type: string
                  desktop:
                    type: boolean
                  env:
                    items:
                      description: HostedVariable reads values from the platform's
                        codex-environment Secret.
                      properties:
                        name:
                          pattern: ^[A-Za-z_][A-Za-z0-9_]{0,127}$
                          type: string
                        secretKey:
                          pattern: ^[a-zA-Z0-9._-]{1,253}$
                          type: string
                      required:
                      - name
                      - secretKey
                      type: object
                      x-kubernetes-validations:
                      - message: Runtime-reserved environment names are restricted
                        rule: self.name != 'PATH' && self.name != 'OPENAI_API_KEY'
                          && !self.name.startsWith('CODEX_')
                    maxItems: 64
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  files:
                    items:
                      description: HostedFile never stores inline bytes in the API.
                      properties:
                        fileID:
                          maxLength: 256
                          minLength: 1
                          type: string
                        path:
                          maxLength: 4096
                          pattern: ^/workspace/
                          type: string
                        secretKey:
                          pattern: ^[a-zA-Z0-9._-]{1,253}$
                          type: string
                        type:
                          enum:
                          - fileID
                          - inline
                          type: string
                      required:
                      - path
                      - type
                      type: object
                      x-kubernetes-validations:
                      - message: fileID branch must match type
                        rule: (self.type == 'fileID') == has(self.fileID)
                      - message: inline branch must match type
                        rule: (self.type == 'inline') == has(self.secretKey)
                    maxItems: 64
                    type: array
                    x-kubernetes-list-map-keys:
                    - path
                    x-kubernetes-list-type: map
                  name:
                    description: Optional display prefix; the controller retains an
                      ownership suffix.
                    maxLength: 128
                    type: string
                  network:
                    description: HostedNetwork sets explicit policy independently
                      of beta/GA defaults.
                    properties:
                      access:
                        enum:
                        - enabled
                        - disabled
                        - restricted
                        type: string
                      allowedDomains:
                        default: []
                        items:
                          maxLength: 253
                          pattern: ^[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?$
                          type: string
                        maxItems: 100
                        type: array
                        x-kubernetes-list-type: set
                      blockedDomains:
                        default: []
                        items:
                          maxLength: 253
                          pattern: ^[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?$
                          type: string
                        maxItems: 100
                        type: array
                        x-kubernetes-list-type: set
                    required:
                    - access
                    type: object
                    x-kubernetes-validations:
                    - message: Domains require restricted access
                      rule: self.access == 'restricted' || (size(self.allowedDomains)
                        == 0 && size(self.blockedDomains) == 0)
                    - message: Allow and block lists cannot be combined
                      rule: size(self.allowedDomains) == 0 || size(self.blockedDomains)
                        == 0
                    - message: Restricted access requires domains
                      rule: self.access != 'restricted' || size(self.allowedDomains)
                        + size(self.blockedDomains) > 0
                  packages:
                    description: HostedPackages contains non-secret package specifiers.
                    properties:
                      npm:
                        items:
                          maxLength: 256
                          type: string
                        maxItems: 64
                        type: array
                      python:
                        items:
                          maxLength: 256
                          type: string
                        maxItems: 64
                        type: array
                      system:
                        items:
                          maxLength: 256
                          type: string
                        maxItems: 64
                        type: array
                    type: object
                  plugins:
                    items:
                      description: HostedInlineCapability carries safe metadata and
                        a protected archive reference.
                      properties:
                        description:
                          maxLength: 2048
                          minLength: 1
                          type: string
                        name:
                          pattern: ^[a-z][a-z0-9-]{0,63}$
                          type: string
                        source:
                          description: HostedArchive pins a protected ZIP to an immutable
                            Secret object version.
                          properties:
                            secretKey:
                              pattern: ^[a-zA-Z0-9._-]{1,253}$
                              type: string
                            secretResourceVersion:
                              maxLength: 128
                              minLength: 1
                              type: string
                            secretUID:
                              maxLength: 128
                              minLength: 1
                              type: string
                          required:
                          - secretKey
                          - secretResourceVersion
                          - secretUID
                          type: object
                      required:
                      - description
                      - name
                      - source
                      type: object
                    maxItems: 16
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  setupCommands:
                    items:
                      description: HostedSetupCommand reads its command from the protected
                        platform Secret.
                      properties:
                        cwd:
                          default: /workspace
                          maxLength: 4096
                          pattern: ^/workspace($|/)
                          type: string
                        secretKey:
                          pattern: ^[a-zA-Z0-9._-]{1,253}$
                          type: string
                      required:
                      - secretKey
                      type: object
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: atomic
                  skills:
                    items:
                      description: HostedSkill selects an exact API version or a pinned
                        protected archive.
                      properties:
                        inline:
                          description: HostedInlineCapability carries safe metadata
                            and a protected archive reference.
                          properties:
                            description:
                              maxLength: 2048
                              minLength: 1
                              type: string
                            name:
                              pattern: ^[a-z][a-z0-9-]{0,63}$
                              type: string
                            source:
                              description: HostedArchive pins a protected ZIP to an
                                immutable Secret object version.
                              properties:
                                secretKey:
                                  pattern: ^[a-zA-Z0-9._-]{1,253}$
                                  type: string
                                secretResourceVersion:
                                  maxLength: 128
                                  minLength: 1
                                  type: string
                                secretUID:
                                  maxLength: 128
                                  minLength: 1
                                  type: string
                              required:
                              - secretKey
                              - secretResourceVersion
                              - secretUID
                              type: object
                          required:
                          - description
                          - name
                          - source
                          type: object
                        skillID:
                          maxLength: 256
                          minLength: 1
                          type: string
                        type:
                          enum:
                          - skillReference
                          - inline
                          type: string
                        version:
                          maxLength: 20
                          pattern: ^[1-9][0-9]*$
                          type: string
                      required:
                      - type
                      type: object
                      x-kubernetes-validations:
                      - message: skillReference requires ID and concrete version
                        rule: (self.type == 'skillReference') == (has(self.skillID)
                          && has(self.version))
                      - message: inline branch must match type
                        rule: (self.type == 'inline') == has(self.inline)
                      - message: inline skill cannot carry reference fields
                        rule: self.type == 'skillReference' || (!has(self.skillID)
                          && !has(self.version))
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: atomic
                required:
                - network
                type: object
              selfHosted:
                description: SelfHostedEnvironment describes platform-approved local
                  compute.
                properties:
                  architecture:
                    enum:
                    - amd64
                    - arm64
                    type: string
                  capabilities:
                    items:
                      description: LocalCapability is a versioned /bundle image copied
                        before the executor starts.
                      properties:
                        image:
                          maxLength: 512
                          pattern: ^[^\s@]+@sha256:[a-f0-9]{64}$
                          type: string
                        name:
                          pattern: ^[a-z][a-z0-9-]{0,31}$
                          type: string
                        path:
                          description: Path selects the actual plugin root, or a directory
                            containing skills.
                          pattern: ^/capabilities/[a-z][a-z0-9-]{0,31}$
                          type: string
                        type:
                          enum:
                          - plugin
                          - skills
                          type: string
                      required:
                      - image
                      - name
                      - path
                      - type
                      type: object
                    maxItems: 16
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  image:
                    maxLength: 512
                    pattern: ^[^\s@]+@sha256:[a-f0-9]{64}$
                    type: string
                  resources:
                    description: ExecutorResources permits CPU and memory only; controller
                      enforces platform bounds.
                    properties:
                      cpuLimit:
                        default: "1"
                        maxLength: 32
                        type: string
                      cpuRequest:
                        default: 100m
                        maxLength: 32
                        type: string
                      memoryLimit:
                        default: 512Mi
                        maxLength: 32
                        type: string
                      memoryRequest:
                        default: 128Mi
                        maxLength: 32
                        type: string
                    type: object
                  workspaceDirectory:
                    default: /workspace
                    maxLength: 4096
                    pattern: ^/
                    type: string
                  workspaceSize:
                    default: 1Gi
                    description: WorkspaceSize bounds an ephemeral volume or requests
                      a persistent claim.
                    maxLength: 32
                    type: string
                  workspaceStorage:
                    description: |-
                      WorkspaceStorage selects whether files survive executor Pod replacement.
                      Omission preserves the legacy ephemeral workspace behavior.
                    properties:
                      claimDeletionPolicy:
                        description: |-
                          ClaimDeletionPolicy deletes or retains the PVC when its Session is deleted.
                          A StorageClass separately controls whether its backing volume is reclaimed.
                        enum:
                        - Delete
                        - Retain
                        type: string
                      storageClassName:
                        description: StorageClassName must also be approved by the
                          operator allowlist.
                        maxLength: 253
                        pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                        type: string
                      type:
                        enum:
                        - Ephemeral
                        - Persistent
                        type: string
                    required:
                    - type
                    type: object
                    x-kubernetes-validations:
                    - message: Persistent storage requires a class and claim deletion
                        policy; Ephemeral permits neither
                      rule: 'self.type == ''Persistent'' ? has(self.storageClassName)
                        && has(self.claimDeletionPolicy) : !has(self.storageClassName)
                        && !has(self.claimDeletionPolicy)'
                required:
                - architecture
                - image
                type: object
            required:
            - mode
            type: object
            x-kubernetes-validations:
            - message: Environment mode is immutable
              rule: self.mode == oldSelf.mode
            - message: selfHosted branch must match mode
              rule: (self.mode == 'selfHosted') == has(self.selfHosted)
            - message: openaiHosted branch must match mode
              rule: (self.mode == 'openaiHosted') == has(self.openaiHosted)
          status:
            description: status defines the observed state of Environment
            properties:
              auditCandidateIDs:
                description: Audit candidates are never adopted automatically.
                items:
                  type: string
                maxItems: 1000
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              configurationDigest:
                type: string
              creationAttempted:
                type: boolean
              creationName:
                type: string
              openaiTemplateID:
                type: string
              ownerScope:
                type: string
              sourceVersion:
                description: EnvironmentSourceVersion identifies protected material
                  without hashing values.
                properties:
                  resourceVersion:
                    type: string
                  uid:
                    type: string
                required:
                - resourceVersion
                - uid
                type: object
              templateConfigurationDigest:
                description: TemplateConfigurationDigest excludes container size and
                  local deletion policy.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: New Environments require an explicit deletionPolicy; once set it
            cannot be removed
          optionalOldSelf: true
          rule: 'oldSelf.hasValue() ? (!has(oldSelf.value().spec.deletionPolicy) ||
            has(self.spec.deletionPolicy)) : has(self.spec.deletionPolicy)'
        - message: New selfHosted Environments require workspaceStorage; once set
            it cannot be removed
          optionalOldSelf: true
          rule: 'self.spec.mode != ''selfHosted'' || (oldSelf.hasValue() ? (!has(oldSelf.value().spec.selfHosted.workspaceStorage)
            || has(self.spec.selfHosted.workspaceStorage)) : has(self.spec.selfHosted.workspaceStorage))'
    served: true
    storage: true
    subresources:
      status: {}
