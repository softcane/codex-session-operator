---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: profiles.agents.softcane.io
spec:
  group: agents.softcane.io
  names:
    kind: Profile
    listKind: ProfileList
    plural: profiles
    singular: profile
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Profile publishes an author-managed recipe without owning remote resources,
          dependencies or the Sessions accepted from it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ProfileSpec binds a namespaced recipe for future conversations. It contains
              references and spending policy, never input, instructions or credentials.
            properties:
              agentRef:
                description: AgentReference cannot address another namespace.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              environmentRef:
                description: AgentReference cannot address another namespace.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              spendControl:
                description: |-
                  SessionSpendControl models the OpenAI Session spend control. A limited
                  Session must set a positive limit in US cents; unlimited has no limit value.
                properties:
                  limitCents:
                    description: LimitCents is a positive US-cent amount when mode
                      is limited.
                    format: int64
                    maximum: 4503599627370495
                    minimum: 1
                    type: integer
                  mode:
                    description: SessionSpendMode requires an explicit monetary policy
                      independently of token limits.
                    enum:
                    - Limited
                    - Unlimited
                    type: string
                required:
                - mode
                type: object
                x-kubernetes-validations:
                - message: limited spending requires limitCents; unlimited spending
                    forbids it
                  rule: (self.mode == 'Limited') == has(self.limitCents)
              vaultRefs:
                items:
                  description: AgentReference cannot address another namespace.
                  properties:
                    name:
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - agentRef
            - environmentRef
            - spendControl
            type: object
          status:
            description: |-
              ProfileStatus records safe policy provenance and current dependency readiness.
              Readiness does not establish that an executor or model task has run.
            properties:
              agent:
                description: ProfileDependencyStatus identifies one observed same-namespace
                  dependency.
                properties:
                  generation:
                    format: int64
                    type: integer
                  name:
                    type: string
                  uid:
                    type: string
                required:
                - generation
                - name
                - uid
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              environment:
                description: ProfileDependencyStatus identifies one observed same-namespace
                  dependency.
                properties:
                  generation:
                    format: int64
                    type: integer
                  name:
                    type: string
                  uid:
                    type: string
                required:
                - generation
                - name
                - uid
                type: object
              observedGeneration:
                format: int64
                type: integer
              policyDigest:
                type: string
              vaults:
                items:
                  description: ProfileDependencyStatus identifies one observed same-namespace
                    dependency.
                  properties:
                    generation:
                      format: int64
                      type: integer
                    name:
                      type: string
                    uid:
                      type: string
                  required:
                  - generation
                  - name
                  - uid
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
