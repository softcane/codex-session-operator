apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-session-operator-gateway
  namespace: codex-session-operator-system
spec:
  template:
    spec:
      containers:
      - name: gateway
        env:
        - name: GATEWAY_METRICS_ADDRESS
          value: :8443
        ports:
        - name: metrics
          containerPort: 8443
---
apiVersion: v1
kind: Service
metadata:
  name: codex-session-operator-gateway
  namespace: codex-session-operator-system
  labels:
    app.kubernetes.io/component: gateway
spec:
  ports:
  - name: metrics
    port: 8443
    targetPort: metrics
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codex-session-operator-gateway-internal
  namespace: codex-session-operator-system
spec:
  ingress:
  - ports:
    - protocol: TCP
      port: 8082
  - from:
    - podSelector:
        matchLabels:
          control-plane: controller-manager
    ports:
    - protocol: TCP
      port: 8083
  - from:
    - namespaceSelector:
        matchLabels:
          metrics: enabled
    ports:
    - protocol: TCP
      port: 8443
