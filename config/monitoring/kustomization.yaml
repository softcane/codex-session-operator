apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: codex-session-operator-system
resources:
- ../gateway
- ../observability
- monitors.yaml
- rbac.yaml
patches:
- path: gateway_patch.yaml
- target:
    kind: Deployment
    name: codex-session-operator-controller-manager
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --metrics-cert-path=/gateway-tls
