apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: codex-session-operator-system
resources:
- ../default
- ../observability
- monitors.yaml
- rbac.yaml
patches:
- path: gateway_patch.yaml
- target:
    kind: Deployment
    name: codex-session-operator-controller-manager
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --metrics-cert-path=/gateway-tls
    - op: add
      path: /spec/template/spec/containers/0/volumeMounts/-
      value:
        name: gateway-tls
        mountPath: /gateway-tls
        readOnly: true
    - op: add
      path: /spec/template/spec/volumes/-
      value:
        name: gateway-tls
        secret:
          secretName: gateway-tls
          defaultMode: 288
