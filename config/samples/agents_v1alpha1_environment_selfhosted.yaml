# Install sandbox_template.yaml in the same namespace and approve codex-workspace-v1.
# Both cleanup policies use persistent storage: Delete removes the Sandbox and
# files on Session close; Retain leaves a suspended Sandbox and its files.
apiVersion: agents.softcane.io/v1alpha1
kind: Environment
metadata:
  name: environment-local
spec:
  mode: SelfHosted
  deletionPolicy: Delete
  selfHosted:
    sandboxPoolRef:
      name: codex-workspace-v1
    workspace:
      directory: /workspace
      deletionPolicy: Delete
