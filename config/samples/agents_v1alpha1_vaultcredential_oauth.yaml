apiVersion: agents.softcane.io/v1alpha1
kind: VaultCredential
metadata:
  name: vaultcredential-oauth
spec:
  vaultRef:
    name: vault-sample
  name: Service MCP OAuth grant
  auth:
    type: mcp_oauth
    mcpOAuth:
      serverURL: https://mcp.example.com/oauth-mcp
      accessTokenSecretRef:
        name: codex-vault
        key: oauth-access-token
      expiresAt: "2030-01-01T00:00:00Z"
      refresh:
        tokenEndpoint: https://auth.example.com/token
        clientID: example-client
        refreshTokenSecretRef:
          name: codex-vault
          key: oauth-refresh-token
        scope: read
        tokenEndpointAuth:
          type: client_secret_basic
          clientSecretRef:
            name: codex-vault
            key: oauth-client-secret
