# This example is not part of samples/kustomization.yaml. Replace the image and
# class with platform-approved values before applying it.
apiVersion: agents.softcane.io/v1alpha1
kind: Environment
metadata:
  name: environment-persistent
spec:
  mode: selfHosted
  deletionPolicy: Retain
  selfHosted:
    image: registry.example/executor@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    architecture: amd64
    workspaceDirectory: /workspace
    workspaceSize: 2Gi
    workspaceStorage:
      type: Persistent
      storageClassName: approved-storage-class
      claimDeletionPolicy: Retain
