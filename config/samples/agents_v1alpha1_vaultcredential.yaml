apiVersion: agents.softcane.io/v1alpha1
kind: VaultCredential
metadata:
  name: vaultcredential-sample
spec:
  vaultRef:
    name: vault-sample
  name: Service MCP bearer credential
  auth:
    type: static_bearer
    staticBearer:
      serverURL: https://mcp.example.com/mcp
      tokenSecretRef:
        name: codex-vault
        key: mcp-token
  deletionPolicy: Delete
