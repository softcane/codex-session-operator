apiVersion: agents.softcane.io/v1alpha1
kind: VaultCredential
metadata:
  name: vaultcredential-hosted
spec:
  deletionPolicy: Delete
  vaultRef:
    name: vault-sample
  name: Hosted API credential
  auth:
    type: environment_variable
    environmentVariable:
      secretName: SERVICE_TOKEN
      secretValueSecretRef:
        name: codex-vault
        key: service-token
      networking:
        type: limited
        allowedHosts:
        - api.example.com
