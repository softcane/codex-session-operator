# Public installation: the controller and gateway are separate Deployments that
# are always installed together. PostgreSQL and credentials are provisioned
# independently before running the coordinated installer.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../gateway
- ../sandbox-policy

# Keep the Kubebuilder CRD conversion scaffold anchors in the conventional
# public overlay as well as the controller-only base.
# +kubebuilder:scaffold:crdkustomizecainjectionns
# +kubebuilder:scaffold:crdkustomizecainjectionname
