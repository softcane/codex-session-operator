apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Import the JSON directly, mount it into Grafana's file provider, or let a
# dashboard sidecar load this labeled ConfigMap.
configMapGenerator:
  - name: codex-session-operator-dashboard
    files:
      - codex-session-operator.json=dashboard.json

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: codex-session-operator
    app.kubernetes.io/component: dashboard
