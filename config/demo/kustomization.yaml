# Disposable Kind demo. The provider simulates OpenAI; no real API key is used.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../default
- provider.yaml
patches:
- path: provider_patch.yaml
images:
- name: controller
  newName: codex-session-controller
  newTag: demo
- name: gateway
  newName: codex-session-gateway
  newTag: demo
