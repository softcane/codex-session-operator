# Optional direct-Session example. Profile-based conversations create their own
# Sessions, so do not apply this file when testing conversation creation.
apiVersion: agents.softcane.io/v1alpha1
kind: Session
metadata:
  name: demo-direct-session
  namespace: codex-session-operator-system
spec:
  agentRef:
    name: demo-investigator-v1
  environmentRef:
    name: demo-text-v1
  spendControl:
    mode: Unlimited
# In none mode, first input through the Session message API triggers remote creation.
