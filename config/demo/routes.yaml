# Trusted gateway policy. The incoming event chooses this route, not an image/key.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-work-routes
  namespace: codex-session-operator-system
data:
  routes.json: |
    [{
      "id": "demo-investigation",
      "namespace": "codex-session-operator-system",
      "source": "manual",
      "agent": "demo-investigator-v1",
      "environment": "demo-text-v1",
      "vaults": [],
      "spend_control": {"mode": "unlimited"}
    }]
# Unlimited is explicit here because inference is simulated. Live limits are
# project-dependent; see docs/deployment.md before choosing a real spend policy.
