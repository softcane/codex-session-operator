name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Validate version tag
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - id: version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          version = os.environ['VERSION']
          number = r'(?:0|[1-9][0-9]*)'
          if not re.fullmatch(r'v' + number + r'\.' + number + r'\.' + number + r'(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?', version) or len(version) > 128:
              raise SystemExit('Use a vX.Y.Z tag, optionally followed by a SemVer prerelease.')
          prerelease = version.partition('-')[2]
          if any(part.isdecimal() and len(part) > 1 and part.startswith('0') for part in prerelease.split('.')):
              raise SystemExit('Numeric prerelease identifiers cannot have leading zeroes.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nprerelease={str(bool(prerelease)).lower()}\n')
          PY

  quality:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml

  publish:
    name: Publish images and deployment assets
    needs: [version, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$REPOSITORY/releases/tags/$VERSION" > "$RUNNER_TEMP/release.json" 2> "$RUNNER_TEMP/release.err"; then
            echo 'This version already has a GitHub release; publish a new version.' >&2
            exit 1
          elif ! grep -q '(HTTP 404)' "$RUNNER_TEMP/release.err"; then
            cat "$RUNNER_TEMP/release.err" >&2
            exit 1
          fi
      - name: Select registry names
        id: images
        run: |
          repository="${REPOSITORY,,}"
          echo "controller=ghcr.io/$repository" >> "$GITHUB_OUTPUT"
          echo "gateway=ghcr.io/$repository-gateway" >> "$GITHUB_OUTPUT"
          echo "executor=ghcr.io/$repository-executor" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish controller
        id: controller
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: controller
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.images.outputs.controller }}:${{ env.VERSION }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Build and publish gateway
        id: gateway
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: gateway
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.images.outputs.gateway }}:${{ env.VERSION }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Build and publish executor
        id: executor
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: executor
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.images.outputs.executor }}:${{ env.VERSION }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Prepare manifest validation
        run: |
          python3 -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/pip" install PyYAML==6.0.3
          echo "$RUNNER_TEMP/release-venv/bin" >> "$GITHUB_PATH"
      - name: Render immutable deployment assets
        env:
          CONTROLLER_IMAGE: ${{ steps.images.outputs.controller }}@${{ steps.controller.outputs.digest }}
          GATEWAY_IMAGE: ${{ steps.images.outputs.gateway }}@${{ steps.gateway.outputs.digest }}
          EXECUTOR_IMAGE: ${{ steps.images.outputs.executor }}@${{ steps.executor.outputs.digest }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          make build-installer CONTROLLER_IMG="$CONTROLLER_IMAGE" GATEWAY_IMG="$GATEWAY_IMAGE"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          import yaml
          controller = os.environ['CONTROLLER_IMAGE']
          gateway = os.environ['GATEWAY_IMAGE']
          executor = os.environ['EXECUTOR_IMAGE']
          for image in (controller, gateway, executor):
              if not re.fullmatch(r'ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}', image):
                  raise SystemExit('An immutable published image digest is required.')
          expected_deployments = {
              'codex-session-operator-controller-manager': ('manager', controller),
              'codex-session-operator-gateway': ('gateway', gateway),
          }
          resources = [resource for resource in yaml.safe_load_all(Path('dist/install.yaml').read_text()) if resource]
          deployments = {resource['metadata']['name']: resource for resource in resources if resource.get('kind') == 'Deployment'}
          jobs = {resource['metadata']['name']: resource for resource in resources if resource.get('kind') == 'Job'}
          if set(deployments) != set(expected_deployments):
              raise SystemExit('install.yaml: expected the controller and gateway Deployments')
          for name, (container_name, image) in expected_deployments.items():
              containers = deployments[name]['spec']['template']['spec']['containers']
              if len(containers) != 1 or containers[0]['name'] != container_name or containers[0]['image'] != image:
                  raise SystemExit(f'install.yaml: unexpected {name} container image')
              if container_name == 'manager':
                  environment = {item['name']: item.get('value') for item in containers[0].get('env', [])}
                  if environment.get('SANDBOX_POOLS') != '':
                      raise SystemExit('install.yaml: Sandbox pool approval must be configured by the administrator')
                  if any(name in environment for name in ('EXECUTOR_IMAGES', 'CAPABILITY_IMAGES', 'WORKSPACE_STORAGE_CLASSES', 'REPOSITORY_URLS')):
                      raise SystemExit('install.yaml: obsolete direct-Pod configuration remains')
          if any(resource.get('kind') in ('SandboxTemplate', 'SandboxWarmPool', 'SandboxClaim', 'Sandbox') for resource in resources):
              raise SystemExit('install.yaml: administrator Sandbox setups must be provisioned separately')
          if jobs:
              raise SystemExit('install.yaml: unexpected Job in runtime-initialized deployment')
          Path('dist/images.json').write_text(json.dumps({'version': os.environ['VERSION'], 'revision': os.environ['SOURCE_REVISION'], 'platforms': ['linux/amd64', 'linux/arm64'], 'controller': controller, 'gateway': gateway, 'executor': executor}, indent=2) + '\n')
          PY
          git diff --exit-code -- go.mod go.sum api config
      - name: Build CLI archives and package the example
        run: |
          make build-cli-release
          cp examples/repository-task.yaml dist/repository-task.yaml
          cd dist
          sha256sum install.yaml images.json repository-task.yaml gateway-client_*.tar.gz > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          args=()
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$VERSION" --repo "$REPOSITORY" --verify-tag \
            --title "$VERSION" --generate-notes "${args[@]}" \
            dist/install.yaml dist/images.json dist/repository-task.yaml \
            dist/gateway-client_*.tar.gz dist/SHA256SUMS
